services:
  - type: web
    name: chatsphere-api
    env: docker
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: chatsphere-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: "15m"
      - key: JWT_REFRESH_EXPIRES
        value: "7d"
      - key: CLIENT_URL
        value: "https://chatsphere-web.onrender.com"
      - key: FRONTEND_URL
        value: "https://chatsphere-web.onrender.com"
      - key: COOKIE_SECURE
        value: "true"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: EMAIL_FROM
        value: "ChatSphere <noreply@chatsphere.app>"
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_API_KEY
        value: ""
      - key: CLOUDINARY_API_SECRET
        value: ""

  - type: web
    name: chatsphere-web
    env: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    dockerBuildArgs:
      - name: NEXT_PUBLIC_API_URL
        value: "https://chatsphere-ootu.onrender.com/api"
      - name: NEXT_PUBLIC_SOCKET_URL
        value: "https://chatsphere-ootu.onrender.com"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: NEXT_PUBLIC_API_URL
        value: "https://chatsphere-ootu.onrender.com/api"
      - key: NEXT_PUBLIC_SOCKET_URL
        value: "https://chatsphere-ootu.onrender.com"

databases:
  - name: chatsphere-db
    databaseName: chatsphere
    user: chatsphere
