name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint -w @chatsphere/web

      - name: Build server
        run: npm run build -w @chatsphere/server

      - name: Build web
        run: npm run build -w @chatsphere/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
